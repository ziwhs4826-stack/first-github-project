<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>픽 터미널</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=10" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="shell">
      <section class="search-panel">
        <div class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" aria-label="상대 챔피언 검색" />
          <span id="resultCount" class="search-count"></span>
        </div>
      </section>

      <section class="result-panel" aria-live="polite">
        <div id="results" class="results"></div>
      </section>

      <button id="editorToggle" class="editor-toggle" type="button" aria-label="데이터 편집 열기" title="데이터 편집">
        ✎
      </button>

      <section id="editorPanel" class="editor-panel" hidden>
        <div class="editor-head">
          <h2>데이터 편집</h2>
          <span>쉼표로 추천 픽을 구분</span>
        </div>
        <form id="matchupForm">
          <label>
            <span>상대</span>
            <input id="enemyInput" type="text" autocomplete="off" placeholder="상대 챔피언" required />
          </label>
          <label>
            <span>대응</span>
            <input id="pickInput" type="text" autocomplete="off" placeholder="추천 픽, 밴, 메모" required />
          </label>
          <button id="saveBtn" type="submit">추가</button>
          <button id="cancelBtn" type="button" hidden>취소</button>
        </form>
        <div class="editor-tools">
          <button id="exportBtn" type="button">내보내기</button>
          <button id="resetBtn" type="button">초기화</button>
        </div>
      </section>
    </main>

    <script src="champions.js?v=4"></script>
    <script src="app.js?v=10"></script>
  </body>
</html>
