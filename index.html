<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080b12" />
    <title>픽 터미널</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css?v=5" />
  </head>
  <body>
    <div class="backdrop" aria-hidden="true"></div>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">TOP LANE COUNTER INTEL</p>
          <h1>픽 터미널</h1>
        </div>
        <div class="status-strip" aria-label="앱 상태">
          <span>LOCAL DB</span>
          <strong id="totalCount">0</strong>
        </div>
        <div class="actions">
          <button id="exportBtn" type="button">내보내기</button>
          <button id="resetBtn" type="button">초기화</button>
        </div>
      </header>

      <section class="search-panel">
        <div class="search-copy">
          <label for="searchInput">ENEMY LOCK-IN</label>
          <p>상대 챔피언 이름만 기준으로 검색합니다.</p>
        </div>
        <div class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" autocomplete="off" placeholder="예: 다리우스, 카밀, 티모" />
        </div>
      </section>

      <section class="result-panel" aria-live="polite">
        <div class="result-head">
          <div>
            <span id="resultLabel">전체 목록</span>
            <p>왼쪽 기준 챔피언만 검색 대상</p>
          </div>
          <span id="resultCount"></span>
        </div>
        <div id="results" class="results"></div>
      </section>

      <section class="editor-panel">
        <div class="editor-head">
          <h2>데이터 편집</h2>
          <span>쉼표로 추천 픽을 구분</span>
        </div>
        <form id="matchupForm">
          <label>
            <span>상대</span>
            <input id="enemyInput" type="text" autocomplete="off" placeholder="상대 챔피언" required />
          </label>
          <label>
            <span>대응</span>
            <input id="pickInput" type="text" autocomplete="off" placeholder="추천 픽, 밴, 메모" required />
          </label>
          <button id="saveBtn" type="submit">추가</button>
          <button id="cancelBtn" type="button" hidden>취소</button>
        </form>
      </section>
    </main>

    <script src="champions.js?v=4"></script>
    <script src="app.js?v=5"></script>
  </body>
</html>
